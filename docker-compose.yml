version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:6
    container_name: phytovision_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - phyto-net

  # 2. FastAPI AI Inference Service
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: phytovision_ai_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./training:/app/training:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TF_ENABLE_ONEDNN_OPTS=0
    networks:
      - phyto-net

  # 3. Node.js Express API Gateway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phytovision_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/phytovisionai
      - JWT_SECRET=${JWT_SECRET:-phyto_vision_ai_jwt_secret_key_prod_2026}
      - AI_SERVICE_URL=http://ai_service:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - mongo
      - ai_service
    networks:
      - phyto-net

  # 4. React Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phytovision_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - phyto-net

volumes:
  mongo-data:
    driver: local

networks:
  phyto-net:
    driver: bridge

